name: Team1 DNN — Quality Gate

# Triggers only when Team 1 files change — Team 2 has its own workflow
on:
  push:
    branches: [main]
    paths:
      - "CICD_MLops/team1_dnn/**"
  pull_request:
    branches: [main]
    paths:
      - "CICD_MLops/team1_dnn/**"

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Get the code ──────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Python setup ──────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ── 3. Cache pip — re-installs only when requirements.txt changes ────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-team1-${{ hashFiles('CICD_MLops/team1_dnn/requirements.txt') }}

      # ── 4. Install dependencies ──────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r CICD_MLops/team1_dnn/requirements.txt

      # ── 5. Decode secret test data (developer never sees this) ───────────
      - name: Restore secret test data
        env:
          SECRET_TEST_DATA_B64: ${{ secrets.SECRET_TEST_DATA_B64 }}
        run: |
          echo "$SECRET_TEST_DATA_B64" | base64 --decode > CICD_MLops/team1_dnn/secret_test_data.npz
          echo "✅ Secret test data restored"

      # ── 6. Quality Gate ───────────────────────────────────────────────────
      # Reads 'staging' model from DEV server (where developer registered it)
      # If it wins → registers + sets 'champion' alias on PROD server
      - name: Quality Gate — Evaluate & Promote
        env:
          # DEV server — read staging model from here
          MLFLOW_DEV_TRACKING_URI:      ${{ secrets.MLFLOW_DEV_TRACKING_URI }}
          MLFLOW_DEV_USERNAME:          ${{ secrets.MLFLOW_DEV_USERNAME }}
          MLFLOW_DEV_PASSWORD:          ${{ secrets.MLFLOW_DEV_PASSWORD }}
          # PROD server — register champion model here
          MLFLOW_PROD_TRACKING_URI:     ${{ secrets.MLFLOW_PROD_TRACKING_URI }}
          MLFLOW_PROD_USERNAME:         ${{ secrets.MLFLOW_PROD_USERNAME }}
          MLFLOW_PROD_PASSWORD:         ${{ secrets.MLFLOW_PROD_PASSWORD }}
          # Script config
          REGISTERED_NAME:              "mnist_classifier"
          SECRET_TEST_PATH:             "CICD_MLops/team1_dnn/secret_test_data.npz"
        run: python CICD_MLops/compare_and_promote.py
