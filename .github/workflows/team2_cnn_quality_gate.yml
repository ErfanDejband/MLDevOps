name: Team 2 CNN — Quality Gate

# evaluate runs on every PR touching team2_cnn (or the shared gate script) —
# read-only, reports pass/fail as the PR check, promotes nothing.
# promote runs only after merge to main — the same script, in promote mode,
# which is the only thing allowed to write a new champion to prod-tracking.
on:
  pull_request:
    branches: [main]
    paths:
      - "CICD_MLops/team2_cnn/**"
      - "CICD_MLops/shared/**"
  push:
    branches: [main]
    paths:
      - "CICD_MLops/team2_cnn/**"
      - "CICD_MLops/shared/**"

jobs:
  evaluate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-team2-py311-${{ hashFiles('requirements.txt', 'CICD_MLops/team2_cnn/requirements.txt') }}

      - name: Install dependencies
        run: pip install -r CICD_MLops/team2_cnn/requirements.txt

      - name: Restore secret test data
        env:
          SECRET_TEST_DATA_B64: ${{ secrets.SECRET_TEST_DATA_B64_TEAM2 }} 
        run: |
          # echo "$SECRET_TEST_DATA_B64" | base64 --decode > CICD_MLops/team2_cnn/secret_test_data.npz
          echo -e " Simplifying the secret test data handling for demonstration purposes.\n In a real scenario, we should use a secure storage or secret management system."
          # Here we directly put he secret test data in the repo for simplicity, but in a real scenario, we should use a secure storage or secret management system.

      - name: Placeholder check
        run: python -c "import sys; sys.path.insert(0, 'CICD_MLops/team2_cnn'); import train"

      - name: Quality Gate — evaluate (dry run, no promotion)
        env:
          MLFLOW_DEV_TRACKING_URI: ${{ secrets.MLFLOW_DEV_TRACKING_URI }}
          MLFLOW_PROD_TRACKING_URI: ${{ secrets.MLFLOW_PROD_TRACKING_URI }}
          MLFLOW_CI_USERNAME: ${{ secrets.MLFLOW_CI_USERNAME }}
          MLFLOW_CI_PASSWORD: ${{ secrets.MLFLOW_CI_PASSWORD }}
          CANDIDATE_ALIAS: team2-candidate
          REGISTERED_MODEL_NAME: mnist_classifier
          SECRET_TEST_PATH: CICD_MLops/team2_cnn/secret_test_data.npz
          ACCURACY_FLOOR: "0.90"
          ARTIFACT_NAME: mnist_cnn_model
        run: python CICD_MLops/shared/quality_gate.py --mode evaluate

  promote:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-team2-py311-${{ hashFiles('requirements.txt', 'CICD_MLops/team2_cnn/requirements.txt') }}

      - name: Install dependencies
        run: pip install -r CICD_MLops/team2_cnn/requirements.txt

      - name: Restore secret test data
        env:
          SECRET_TEST_DATA_B64: ${{ secrets.SECRET_TEST_DATA_B64_TEAM2 }} 
        run: |
          # echo "$SECRET_TEST_DATA_B64" | base64 --decode > CICD_MLops/team2_cnn/secret_test_data.npz
          echo -e " Simplifying the secret test data handling for demonstration purposes.\n In a real scenario, we should use a secure storage or secret management system."
          # Here we directly put he secret test data in the repo for simplicity, but in a real scenario, we should use a secure storage or secret management system.

      - name: Quality Gate — promote (writes to prod-tracking only on pass)
        env:
          MLFLOW_DEV_TRACKING_URI: ${{ secrets.MLFLOW_DEV_TRACKING_URI }}
          MLFLOW_PROD_TRACKING_URI: ${{ secrets.MLFLOW_PROD_TRACKING_URI }}
          MLFLOW_CI_USERNAME: ${{ secrets.MLFLOW_CI_USERNAME }}
          MLFLOW_CI_PASSWORD: ${{ secrets.MLFLOW_CI_PASSWORD }}
          CANDIDATE_ALIAS: team2-candidate
          REGISTERED_MODEL_NAME: mnist_classifier
          SECRET_TEST_PATH: CICD_MLops/team2_cnn/secret_test_data.npz
          ACCURACY_FLOOR: "0.90"
          ARTIFACT_NAME: mnist_cnn_model
        run: python CICD_MLops/shared/quality_gate.py --mode promote
